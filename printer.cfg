# =============================================================================
# Klipper configuration - Mingda Magician Max (GD32 version)
# -----------------------------------------------------------------------------
# Board        : langgo407 / BC.DZ.PC000007
# MCU          : GD32F407VET6 (STM32F407-compatible, 512K flash / 192K RAM)
# Firmware     : klipper.bin built for STM32F407, "64KiB bootloader" (app at
#                0x08010000), 8 MHz crystal.
# Derived from : Marlin-2.0.x/Marlin/Configuration.h, Configuration_adv.h and
#                Marlin/src/pins/stm32f4/pins_langgo407.h, plus the
#                raptordemon/mmxklipper port for the Mingda Magician X.
#
# NOTE: The stock FSMC TFT/touchscreen is NOT supported by Klipper. Use a
#       Klipper host (Raspberry Pi / Linux) with Mainsail or Fluidd.
# =============================================================================

# ----------------------------------------------------------------------------
# MCU
# ----------------------------------------------------------------------------
[mcu]
# USART3 (MCU TX=PB10 / RX=PB11) wired to the Pi GPIO UART.
# Pi side: enable PL011 (enable_uart=1 + dtoverlay=disable-bt) -> /dev/serial0
# See MagicianMax_Klipper_Guide.md Part 3 (USART).
serial: /dev/serial0
baud: 250000
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 200
max_accel: 800
max_z_velocity: 10
max_z_accel: 100
square_corner_velocity: 5.0

# ----------------------------------------------------------------------------
# Steppers  (pins from pins_langgo407.h active branch)
# ----------------------------------------------------------------------------
[stepper_x]
step_pin: PD2
dir_pin: PC10
enable_pin: !PD3
microsteps: 16
rotation_distance: 40        # 200 * 16 / 80 steps-per-mm
endstop_pin: !PF12
position_endstop: 0
position_min: 0
position_max: 320
homing_speed: 50
homing_retract_dist: 5

[stepper_y]
step_pin: PA10
dir_pin: !PA9
enable_pin: !PC12
microsteps: 16
rotation_distance: 40        # 200 * 16 / 80
endstop_pin: !PF14
position_endstop: 0
position_min: 0
position_max: 320
homing_speed: 50
homing_retract_dist: 5

[stepper_z]
step_pin: PG8
dir_pin: !PG7
enable_pin: !PC9
microsteps: 16
rotation_distance: 4         # 200 * 16 / 800
# Z homes on the Hall-plate probe (the IR Z endstop on PG0 is ignored; Z passes
# through it and continues until the probe triggers).
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 400
homing_speed: 10
second_homing_speed: 3
homing_retract_dist: 3

# Second Z motor (Marlin NUM_Z_STEPPER_DRIVERS = 2). The two Z screws are
# belt-coupled on the Max, so this simply mirrors stepper_z (no z_tilt).
[stepper_z1]
step_pin: PG4
dir_pin: !PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 4

[extruder]
max_extrude_only_distance: 150
step_pin: PD12
dir_pin: !PD11
enable_pin: !PD13
microsteps: 16
control: pid
rotation_distance: 7.681    # 200 * 16 / 416.6 - calibrate with your own value
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC6
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
min_temp: 0
max_temp: 300               # Marlin 2.0.x allowed 315 with the Ti choke
# Marlin defaults: DEFAULT_Kp 17.35 / DEFAULT_Ki 0.6 / DEFAULT_Kd 97.13
pid_Kp: 17.35
pid_Ki: 0.60
pid_Kd: 97.13
# Refine with:  PID_CALIBRATE HEATER=extruder TARGET=200   then SAVE_CONFIG

# ----------------------------------------------------------------------------
# TMC2208 drivers - half-duplex single wire UART (Marlin software serial pins)
# I=0.11 ohm sense resistors, currents are RMS (from Configuration_adv.h).
# If X loses sync, set stealthchop_threshold: 0 on X/Y (spreadCycle).
# ----------------------------------------------------------------------------
[tmc2208 stepper_x]
uart_pin: PD6
run_current: 0.500
hold_current: 0.250
stealthchop_threshold: 999999

[tmc2208 stepper_y]
uart_pin: PC11
run_current: 0.700
hold_current: 0.350
stealthchop_threshold: 999999

[tmc2208 stepper_z]
uart_pin: PA8
run_current: 0.600
hold_current: 0.300
# spreadCycle: omit stealthchop_threshold (stealthChop caused a false
# "ShortToSupply_B" on Z1)

[tmc2208 stepper_z1]
uart_pin: PG6
run_current: 0.600
hold_current: 0.300
# spreadCycle: omit stealthchop_threshold (stealthChop caused a false
# "ShortToSupply_B" on Z1)

[tmc2208 extruder]
uart_pin: PG2
run_current: 0.500
hold_current: 0.250
stealthchop_threshold: 999999

# ----------------------------------------------------------------------------
# Heated bed
# ----------------------------------------------------------------------------
[heater_bed]
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
control: pid
min_temp: 0
max_temp: 110               # Mingda spec (Marlin BED_MAXTEMP was 125)
# Marlin defaults: bedKp 92.05 / bedKi 17.98 / bedKd 314.20
pid_Kp: 92.05
pid_Ki: 17.98
pid_Kd: 314.20
# Refine with:  PID_CALIBRATE HEATER=heater_bed TARGET=60   then SAVE_CONFIG

# ----------------------------------------------------------------------------
# Fan
# ----------------------------------------------------------------------------
[fan]
pin: PC7

# ----------------------------------------------------------------------------
# Z probe - Hall plate, fixed mount (Marlin FIX_MOUNTED_PROBE / HALL_PLATE)
#   probe signal : PB0 (Z_MIN_PROBE_PIN, active low)
#   probe power  : PB1 (CALIB_PIN) toggled on/off around probing
# ----------------------------------------------------------------------------
[output_pin probe_ctrl]
pin: PB1

[probe]
# Hall-plate (D301) probe. Marlin enables a pulldown on the probe pin and
# "arms" the sensor by pulsing CALIB_PIN (PB1) LOW->HIGH until the probe reads
# ready, before each probe. We reproduce that here.
pin: ~!PB0
x_offset: 0
y_offset: 0
z_offset: 0
speed: 5
samples: 2
sample_retract_dist: 2
activate_gcode:
    SET_PIN PIN=probe_ctrl VALUE=0
    G4 P50
    SET_PIN PIN=probe_ctrl VALUE=1
    G4 P50
    SET_PIN PIN=probe_ctrl VALUE=0
    G4 P50
    SET_PIN PIN=probe_ctrl VALUE=1
    G4 P50
deactivate_gcode:
    SET_PIN PIN=probe_ctrl VALUE=0
# Run PROBE_CALIBRATE (and Z_OFFSET_APPLY_PROBE) to set the real z_offset.

[safe_z_home]
home_xy_position: 160, 160
speed: 50
z_hop: 10
z_hop_speed: 5

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 20, 20
mesh_max: 300, 300
probe_count: 4, 4          # Marlin used BILINEAR 4x4
algorithm: bicubic
# Adjust mesh_min/mesh_max if the carriage cannot reach the corners.

# ----------------------------------------------------------------------------
# Filament runout sensor
# ----------------------------------------------------------------------------
[filament_switch_sensor filament_sensor]
pause_on_runout: True
switch_pin: ^PG1

# ----------------------------------------------------------------------------
# NeoPixel LEDs (6 LEDs on the toolhead)
# ----------------------------------------------------------------------------
[neopixel leds]
pin: PB9
chain_count: 6
color_order: GRB
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0

# ----------------------------------------------------------------------------
# Miscellaneous
# ----------------------------------------------------------------------------
# NOTE: the on-die MCU temperature sensor is disabled - it needs the STM32
# factory calibration values (0x1FFF7A2C) which are zero on the GD32F407 and
# cause a divide-by-zero in Klipper's temperature_mcu module.
# [temperature_sensor mcu_temp]
# sensor_type: temperature_mcu

[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]

[pause_resume]

[exclude_object]

[include mainsail.cfg]
[include macros.cfg]

