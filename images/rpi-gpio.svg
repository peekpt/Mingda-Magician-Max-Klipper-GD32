<text x="632" y="446" font-size="15" font-weight="bold" fill="#202124">20</text>
<text x="666" y="446" font-size="15" fill="#202124">GND</text>
<rect x="620" y="460" width="310" height="28" rx="7" fill="#eceff1" stroke="#9aa0a6"/>
