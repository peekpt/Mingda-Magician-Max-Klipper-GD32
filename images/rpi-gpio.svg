<text x="666" y="752" font-size="15" fill="#202124">GPIO20</text>
<rect x="620" y="766" width="310" height="28" rx="7" fill="#eceff1" stroke="#9aa0a6"/>
<text x="632" y="786" font-size="15" font-weight="bold" fill="#202124">40</text>
<text x="666" y="786" font-size="15" fill="#202124">GPIO21</text>
<text x="110" y="820" font-size="20" font-weight="bold" fill="#202124">Used for the printer:</text>
<rect x="112" y="839" width="18" height="18" rx="4" fill="#7bd07b" stroke="#9aa0a6"/>
<text x="144" y="854" font-size="17" fill="#202124">Pi TX   =  GPIO14  =  physical pin 8</text>
<rect x="112" y="869" width="18" height="18" rx="4" fill="#7fb6e6" stroke="#9aa0a6"/>
<text x="144" y="884" font-size="17" fill="#202124">Pi RX   =  GPIO15  =  physical pin 10</text>
<rect x="112" y="899" width="18" height="18" rx="4" fill="#f4b942" stroke="#9aa0a6"/>
<text x="144" y="914" font-size="17" fill="#202124">GND     =  physical pin 6</text>
