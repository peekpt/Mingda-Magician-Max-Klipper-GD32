# =============================================================================
# Macros - Mingda Magician Max (Klipper)
# PAUSE / RESUME / CANCEL_PRINT are provided by [pause_resume] in printer.cfg.
# =============================================================================

[gcode_macro START_PRINT]
description: Home and heat before a print. Usage: START_PRINT BED=60 EXTRUDER=200
gcode:
    {% set BED_TEMP = params.BED|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER|default(200)|float %}

    # Save current state (nozzle may be off the bed)
    G90
    M140 S{BED_TEMP}                    # start heating the bed
    M104 S{EXTRUDER_TEMP}               # start heating the hotend
    BEEP_START                          # 3 short beeps

    G28                                 # home all axes
    M190 S{BED_TEMP}                    # wait for bed
    M109 S{EXTRUDER_TEMP}               # wait for hotend

    # Apply the saved bed mesh (created with BED_MESH_CALIBRATE, which saves
    # the profile as "default"). Run bed leveling once before the first print.
    BED_MESH_PROFILE LOAD=default

    G92 E0
    G1 Z2.0 F3000                        # lift
    G1 X10 Y10 F5000                     # move to start position
    G1 E15 F300                          # purge a little filament
    G1 X60 E25 F1000                     # wipe while purging
    G92 E0

[gcode_macro END_PRINT]
description: Turn off heaters and park at the end of a print
gcode:
    M400                                 # finish all moves
    M104 S0                              # hotend off
    M140 S0                              # bed off
    M106 S0                              # fan off
    M107
    G91
    G1 E-2 F2700                         # small retract
    G1 E-2 Z0.2 F2400
    G1 X10 Y10 F3000                     # wipe
    G1 Z10 F3000                         # lift
    G90
    G1 X10 Y300 F5000                    # park
    END_TUNE                             # finish jingle
    M84                                  # disable steppers

[gcode_macro LOAD_FILAMENT]
description: Heat up and load filament
gcode:
    {% set TEMP = params.TEMP|default(220)|float %}
    M109 S{TEMP}
    G91
    G1 E100 F300
    G90

[gcode_macro UNLOAD_FILAMENT]
description: Heat up and unload filament
gcode:
    {% set TEMP = params.TEMP|default(220)|float %}
    M109 S{TEMP}
    G91
    G1 E-100 F300
    G90

[gcode_macro M600]
description: Filament change (simple pause)
gcode:
    PAUSE

[gcode_macro G29]
description: Preheat bed to 60C and hotend to 200C, home, then run bed mesh leveling
gcode:
    {% set BED = params.BED|default(60)|float %}
    {% set HOTEND = params.HOTEND|default(200)|float %}
    M140 S{BED}                          # start heating bed
    M104 S{HOTEND}                       # start heating hotend
    M190 S{BED}                          # wait for bed
    M109 S{HOTEND}                       # wait for hotend
    BED_MESH_CALIBRATE                   # 4x4, 3 samples; saved as "default"
    {action_respond_info("Bed mesh complete - run SAVE_CONFIG to persist it.")}

[gcode_macro M300]
description: Buzzer note. S = frequency Hz (0 = rest), P = duration ms; mute with SOUND_OFF
gcode:
    {% if printer['gcode_macro _SOUND'].value|int %}
        {% set S = params.S|default(1000)|float %}
        {% set P = params.P|default(150)|float %}
        {% if S > 0 %}
            SET_PIN PIN=beeper VALUE=0.5 CYCLE_TIME={1.0 / S}
            G4 P{P|int}
            SET_PIN PIN=beeper VALUE=0
        {% else %}
            G4 P{P|int}
        {% endif %}
    {% endif %}

[gcode_macro BEEP]
description: Short beep
gcode:
    M300 P100

# -----------------------------------------------------------------------------
# Buzzer helper: one note plus an explicit silence after it.
#
# The buzzer uses [pwm_cycle_time beeper] and that pin only accepts ONE SET_PIN
# per 100 ms (Klipper's MIN_SCHEDULE_TIME = 0.100 s, enforced in
# klippy/extras/pwm_cycle_time.py). Consequences:
#   * a note shorter than 100 ms is held for 100 ms;
#   * a gap shorter than 100 ms becomes 100 ms;
#   * a note whose start gets pushed back still ends at its written time, so it
#     is cut short.
# That is why a tune written with 40 ms gaps plays as a flat stream of 100 ms
# beeps. Keep every P and GAP a multiple of 100 ms and what is written here is
# what comes out of the buzzer.
#   LEGATO=1: leaves the pin on, so the next TONE only changes frequency (fast
#   runs). Two identical frequencies in a row then merge into a single note.
# -----------------------------------------------------------------------------
[gcode_macro TONE]
description: Buzzer note. TONE S=<Hz> P=<ms> [GAP=<ms>] [LEGATO=1]
gcode:
    {% set S = params.S|default(1000)|float %}
    {% set P = params.P|default(100)|float %}
    {% set GAP = params.GAP|default(0)|float %}
    {% set LEGATO = params.LEGATO|default(0)|int %}
    {% if printer['gcode_macro _SOUND'].value|int and S > 0 %}
        SET_PIN PIN=beeper VALUE=0.5 CYCLE_TIME={1.0 / S}
        G4 P{P|int}
        {% if not LEGATO %}
            SET_PIN PIN=beeper VALUE=0
        {% endif %}
        {% if GAP > 0 %}
            G4 P{GAP|int}
        {% endif %}
    {% endif %}

[gcode_macro PROBE_CALIBRATE]
rename_existing: PROBE_CALIBRATE_BASE
description: Preheat bed 60C / hotend 200C, then run the Z-offset (probe) calibration
gcode:
    {% set BED = params.BED|default(60)|float %}
    {% set HOTEND = params.HOTEND|default(200)|float %}
    M140 S{BED}
    M104 S{HOTEND}
    M190 S{BED}
    M109 S{HOTEND}
    G28
    G1 X160 Y160 F6000                  # center over the bed for the probe
    PROBE_CALIBRATE_BASE

[gcode_macro Z_UP]
description: Manual probe - move nozzle up (TESTZ Z=+)
gcode:
    TESTZ Z=+

[gcode_macro Z_DOWN]
description: Manual probe - move nozzle down (TESTZ Z=-)
gcode:
    TESTZ Z=-

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_BASE
description: Home (G28) then run bed mesh calibration
gcode:
    G28
    BED_MESH_CALIBRATE_BASE


# =============================================================================
# Mainsail client hook - run PAUSE_BEEP after the base PAUSE
# =============================================================================
[gcode_macro _CLIENT_VARIABLE]
variable_user_pause_macro: 'PAUSE_BEEP'
gcode:

# =============================================================================
# Buzzer sounds + mute switch (Moonraker power device -> gcode_macro _SOUND)
# =============================================================================
[gcode_macro _SOUND]
description: Internal sound switch (VALUE=1 on / 0 mute). Toggled by Moonraker.
variable_value: 1
gcode:
    {% set state = params.VALUE|int %}
    SET_GCODE_VARIABLE MACRO=_SOUND VARIABLE=value VALUE={state}
    {% if state %}
        {action_respond_info("Som: LIGADO")}
    {% else %}
        {action_respond_info("Som: DESLIGADO (mute)")}
    {% endif %}

[gcode_macro SOUND_ON]
description: Enable buzzer sounds
gcode:
    _SOUND VALUE=1

[gcode_macro SOUND_OFF]
description: Mute buzzer sounds
gcode:
    _SOUND VALUE=0

[gcode_macro SOUND_TOGGLE]
description: Toggle buzzer sounds on/off
gcode:
    {% if printer['gcode_macro _SOUND'].value|int %}
        _SOUND VALUE=0
    {% else %}
        _SOUND VALUE=1
    {% endif %}

[gcode_macro BEEP_START]
description: 3 short beeps at print start
gcode:
    M300 S1800 P100
    G4 P100
    M300 S1800 P100
    G4 P100
    M300 S1800 P100

[gcode_macro PAUSE_BEEP]
description: beep-boop x4 when the print is paused
gcode:
    M300 S1600 P150
    G4 P100
    M300 S700 P220
    G4 P100
    M300 S1600 P150
    G4 P100
    M300 S700 P220
    G4 P100
    M300 S1600 P150
    G4 P100
    M300 S700 P220
    G4 P100
    M300 S1600 P150
    G4 P100
    M300 S700 P220

[gcode_macro END_TUNE]
description: Finish jingle - "ta, | ta-ra-ra-ta | ta | taaaa"
gcode:
    # Every value is a multiple of 100 ms (see TONE): written = played.
    # NB: before this fix the 40/60 ms gaps were silently stretched to 100 ms,
    # so every note after the pickup came out as a flat 100 ms beep (and the
    # final 450 ms note was clipped to 310 ms).
    TONE S1568 P300 GAP=200             # ta,   (pickup + breath)
    # ta-ra-ra-ta - fast run, one note every 200 ms
    TONE S1568 P100 GAP=100             # ta
    TONE S1760 P100 GAP=100             # RA    (accent)
    TONE S1568 P100 GAP=100             # ra
    TONE S1568 P100 GAP=100             # ta
    # Variant with the accent on the 3rd note of the run (G G A G) - comment the
    # four lines above and uncomment these four:
    #TONE S1568 P100 GAP=100            # ta
    #TONE S1568 P100 GAP=100            # ra
    #TONE S1760 P100 GAP=100            # RA
    #TONE S1568 P100 GAP=100            # ta
    TONE S1568 P300 GAP=100             # ta
    TONE S2093 P800                     # taaaa

[gcode_macro PLAY_SHUTDOWN_TUNE]
description: Windows shutdown melody (played on graceful Pi shutdown)
gcode:
    M300 P125 S831
    M300 P125 S0
    M300 P125 S622
    M300 P125 S0
    M300 P125 S415
    M300 P125 S0
    M300 P125 S466

# =============================================================================
# Pi startup tune
# =============================================================================
[gcode_macro PLAY_STARTUP_TUNE]
description: Windows XP startup melody (played on Pi boot/reboot)
gcode:
    M300 P125 S622
    M300 P125 S0
    M300 P125 S311
    M300 P125 S311
    M300 P250 S0
    M300 P125 S415
    M300 P375 S0
    M300 P125 S622
    M300 P125 S0
    M300 P500 S466

# =============================================================================
# Material preheat macros (set targets; use M190/M109 to also wait)
# =============================================================================
[gcode_macro PREHEAT_PLA]
description: Preheat for PLA - bed 60C / hotend 200C
gcode:
    M140 S60
    M104 S200

[gcode_macro PREHEAT_PETG]
description: Preheat for PETG - bed 80C / hotend 240C
gcode:
    M140 S80
    M104 S240

[gcode_macro PREHEAT_ABS]
description: Preheat for ABS - bed 100C / hotend 250C
gcode:
    M140 S100
    M104 S250

[gcode_macro PREHEAT_TPU]
description: Preheat for TPU - bed 50C / hotend 230C
gcode:
    M140 S50
    M104 S230
